<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora TypeScript</title>
  <style>
    body { font-family: system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f4f4f9; }
    .calculator { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 280px; }
    .field { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 0.4rem; font-weight: 600; }
    input, select, button { width: 100%; padding: 0.6rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #0066cc; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 0.5rem; }
    button:hover { background: #0052a3; }
    #result { margin-top: 1rem; padding: 0.8rem; background: #eef2ff; border-radius: 4px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>
  <div class="calculator">
    <h2>Calculadora</h2>
    <div class="field">
      <label for="num1">Número 1</label>
      <input type="number" id="num1" value="0">
    </div>
    <div class="field">
      <label for="operation">Operación</label>
      <select id="operation">
        <option value="add">+</option>
        <option value="subtract">−</option>
        <option value="multiply">×</option>
        <option value="divide">÷</option>
      </select>
    </div>
    <div class="field">
      <label for="num2">Número 2</label>
      <input type="number" id="num2" value="0">
    </div>
    <button onclick="calculate()">Calcular</button>
    <div id="result">Resultado: 0</div>
  </div>

  <!-- Cargar los scripts compilados -->
  <script src="./sum.js"></script>
  <script src="./subtract.js"></script>
  <script src="./multiply.js"></script>
  <script src="./divide.js"></script>

  <script>
    function calculate() {
      const a = parseFloat(document.getElementById('num1').value);
      const b = parseFloat(document.getElementById('num2').value);
      const op = document.getElementById('operation').value;
      const resultDiv = document.getElementById('result');

      if (isNaN(a) || isNaN(b)) {
        resultDiv.innerText = "Error: Ingrese números válidos";
        return;
      }

      try {
        let res;
        switch (op) {
          case 'add': res = window.sum(a, b); break;
          case 'subtract': res = window.subtract(a, b); break;
          case 'multiply': res = window.multiply(a, b); break;
          case 'divide': res = window.divide(a, b); break;
        }
        resultDiv.innerText = `Resultado: ${res}`;
      } catch (err) {
        resultDiv.innerText = `Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
